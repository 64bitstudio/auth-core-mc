# Ticket 010 (origen): build + tests + análisis de calidad (SonarQube) +
# notificación a Telegram en cada push a cualquier rama.
# Ticket 049: pipeline de CI/CD a la VM dedicada. Historia completa del
# rediseño de ramas (dev/qa/prod) y del pivote de orquestador (GitHub
# Actions -> Jenkins) en docs/ARQUITECTURA.md — no se repite aquí.
#
# RETIRO DE LA DUPLICACIÓN (ticket 049, tras confirmar el Jenkinsfile
# funcionando de punta a punta — PR #78 ya mergeado a dev): mientras se
# validaba el pivote a Jenkins, este workflow corrió EN PARALELO con el
# Jenkinsfile — cada push a dev/qa/prod disparaba Sonar+build+deploy DOS
# veces (una por sistema), en una VM de solo 2 vCPU. Con Jenkins ya
# confirmado, se retiran de aquí los jobs que duplicaban lo que el
# Jenkinsfile ya hace: `build-test-analyze` (Sonar), `build-image`,
# `deploy-dev`, `deploy-qa`, `deploy-prod`. El Jenkinsfile es ahora el
# ÚNICO orquestador de build+test+Sonar+deploy.
#
# Lo que SÍ se queda, y por qué: `sync-vm-infra` no es parte de la
# duplicación — es la infra compartida de la VM (Traefik, SonarQube, el
# propio contenedor de Jenkins, certificados, firewall) y nada del lado
# de Jenkins la reemplaza. Se renombra el workflow (antes "CI") para
# reflejar que su único propósito ahora es ese, no "build+test".
#
# Consecuencia de este retiro: la branch protection de dev/qa/prod dejó
# de requerir el check `build-test-analyze` (que ya no existe) y pasó a
# requerir `continuous-integration/jenkins/branch` (el check que publica
# el Jenkinsfile) — actualizado vía API en el mismo cambio que retiró
# estos jobs, para no dejar el auto-merge de feature -> dev roto.
name: Infra Sync (VM)

on:
  push:
    branches: ["**"]

jobs:
  # Asegura la infra compartida de la VM (red `edge`, Traefik, SonarQube,
  # Jenkins, certificados, firewall) en CUALQUIER push, a cualquier rama.
  # Idempotente ("docker compose up -d"/"docker network create" no hacen
  # nada si ya existen) — seguro de correr en cada push, no solo la
  # primera vez.
  sync-vm-infra:
    runs-on: [self-hosted, vm-oci]
    steps:
      - uses: actions/checkout@v4

      - name: Red compartida "edge" (Traefik <-> stacks de cada proyecto)
        run: docker network inspect edge >/dev/null 2>&1 || docker network create edge

      # Ticket 049 (pivote GH Actions -> Jenkins): red interna, SIN
      # tráfico público -- solo para que Jenkins alcance a SonarQube por
      # nombre de contenedor ("sonarqube:9000"), no vía Traefik.
      - name: Red compartida "vm-infra" (Jenkins <-> SonarQube)
        run: docker network inspect vm-infra >/dev/null 2>&1 || docker network create vm-infra

      - name: Traefik (ingress compartido de la VM, puertas adentro)
        run: docker compose -f deploy/vm-infra/traefik/docker-compose.yml up -d

      # Hallazgo real (primer intento del rediseño dev/qa/prod): la VM ya
      # traía nginx en el puerto 80/443 (paquete de fábrica de Ubuntu) —
      # decisión de Marco: NO deshabilitarlo, se queda como puerta de
      # entrada pública y le hace reverse proxy a Traefik (que por eso
      # publica su entrypoint solo en 127.0.0.1:8000, nunca directo al
      # mundo). Ver docs/ARQUITECTURA.md ticket 049 y
      # deploy/vm-infra/nginx/auth-core-mc.conf para el detalle completo.
      - name: nginx -> Traefik (vhost de auth-core-mc)
        run: |
          sudo cp deploy/vm-infra/nginx/auth-core-mc.conf /etc/nginx/sites-available/auth-core-mc.conf
          sudo ln -sf /etc/nginx/sites-available/auth-core-mc.conf /etc/nginx/sites-enabled/auth-core-mc.conf
          sudo nginx -t
          sudo systemctl reload nginx

      # Ticket 049 (pivote GH Actions -> Jenkins) — mismo patrón que el
      # vhost de arriba, para jenkins.64bitstudio.com.
      - name: nginx -> Traefik (vhost de Jenkins)
        run: |
          sudo cp deploy/vm-infra/nginx/jenkins.conf /etc/nginx/sites-available/jenkins.conf
          sudo ln -sf /etc/nginx/sites-available/jenkins.conf /etc/nginx/sites-enabled/jenkins.conf
          sudo nginx -t
          sudo systemctl reload nginx

      # Ticket 050 (Portainer + subdominios): Basic Auth compartido de
      # nginx para sonarqube/traefik/portainer.64bitstudio.com — hash
      # apr1 (formato que entiende auth_basic_user_file de nginx, sin
      # depender del paquete apache2-utils/htpasswd, no instalado en esta
      # VM). Bootstrap idempotente (nunca pisa un hash ya generado) — debe
      # correr ANTES del paso de abajo que copia el vhost, porque
      # "nginx -t" falla si auth_basic_user_file no existe todavía.
      # Deliberadamente NO bajo /home/ubuntu/secrets/: ese árbol solo es
      # legible por Docker vía bind-mount con el UID/GID de cada
      # contenedor (ver "Permisos de grupo..." más abajo) — nginx corre
      # como el usuario de sistema "www-data" sin membresía en el grupo
      # "ubuntu" y sin traversal a /home/ubuntu (permisos 750). Abrir eso
      # a nivel de todo /home/ubuntu para que www-data pase habría sido un
      # cambio de alcance mucho más amplio que el necesario — hallazgo
      # real de este ticket. /etc/nginx/secrets/ es el árbol nativo que
      # nginx ya puede leer (root:root, patrón estándar de htpasswd,
      # mundo-legible en 644 — es un hash, no la contraseña en claro).
      - name: Asegurar Basic Auth compartido de nginx (.htpasswd) si falta
        run: |
          sudo mkdir -p /etc/nginx/secrets
          sudo chmod 755 /etc/nginx/secrets
          FILE=/etc/nginx/secrets/vm-admin-tools.htpasswd
          if [ ! -f "$FILE" ]; then
            PW=$(openssl rand -base64 24 | tr -d '=+/\n')
            HASH=$(openssl passwd -apr1 "$PW")
            printf "admin:%s\n" "$HASH" | sudo tee "$FILE" > /dev/null
            sudo chmod 644 "$FILE"
            sudo chown root:root "$FILE"
            echo "Creado $FILE (usuario 'admin', password generado, no impreso) -- Marco debe pedirlo a quien lo generó si lo perdió."
          fi

      # Ticket 050 (Portainer + subdominios): mismo patrón que los vhosts
      # de arriba, para los 3 subdominios de infra privilegiada (SonarQube,
      # dashboard de Traefik, Portainer) — un solo vhost con los 3
      # server_name, detrás de Basic Auth (ver deploy/vm-infra/nginx/
      # vm-admin-tools.conf). Depende del paso anterior (el .htpasswd debe
      # existir antes de "nginx -t").
      - name: nginx -> Traefik (vhost de las 3 herramientas de infra + Basic Auth)
        run: |
          sudo cp deploy/vm-infra/nginx/vm-admin-tools.conf /etc/nginx/sites-available/vm-admin-tools.conf
          sudo ln -sf /etc/nginx/sites-available/vm-admin-tools.conf /etc/nginx/sites-enabled/vm-admin-tools.conf
          sudo nginx -t
          sudo systemctl reload nginx

      # Hallazgo real: el firewall local de la VM (iptables, persistido con
      # iptables-persistent/netfilter-persistent) solo tenía reglas ACCEPT
      # explícitas para 22 (SSH), 25 (SMTP de mail-core-mc) y 80 (HTTP) —
      # con un REJECT catch-all al final. 443 nunca estuvo abierto (nadie
      # lo había necesitado hasta ahora). Se agrega la regla justo antes
      # del REJECT (nunca al final, quedaría después del catch-all y no
      # serviría de nada) y se persiste para que sobreviva un reinicio.
      # Idempotente: no duplica la regla si ya existe.
      - name: Abrir 443/tcp en el firewall de la VM (para Traefik/nginx HTTPS)
        run: |
          if ! sudo iptables -C INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null; then
            REJECT_LINE=$(sudo iptables -L INPUT --line-numbers | awk '/REJECT/{print $1; exit}')
            sudo iptables -I INPUT "$REJECT_LINE" -p tcp --dport 443 -j ACCEPT
            sudo netfilter-persistent save
          fi

      # Certificado real de Let's Encrypt para los 3 subdominios, vía el
      # plugin de nginx de certbot (edita el vhost solo, agrega el bloque
      # 443/ssl + redirect 80->443 — no hace falta versionar esa parte a
      # mano). Idempotente: certbot no reemite si el certificado ya es
      # válido, así que es seguro correr esto en cada push. Requiere que
      # los 3 registros DNS ya resuelvan a esta VM (confirmados por Marco
      # antes de este paso).
      - name: Certificado Let's Encrypt (certbot + nginx)
        run: |
          if ! command -v certbot >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y certbot python3-certbot-nginx
          fi
          sudo certbot --nginx --non-interactive --agree-tos \
            -m marco.cortes@64bitstudio.com \
            -d auth.64bitstudio.com \
            -d auth-qa.64bitstudio.com \
            -d auth-dev.64bitstudio.com \
            --redirect

      # Ticket 049 (pivote GH Actions -> Jenkins) — certificado aparte
      # (no se puede meter en el -d de arriba: certbot exige que TODOS los
      # SAN de una misma petición resuelvan). Idempotente.
      - name: Certificado Let's Encrypt para Jenkins
        continue-on-error: true
        run: |
          sudo certbot --nginx --non-interactive --agree-tos \
            -m marco.cortes@64bitstudio.com \
            -d jenkins.64bitstudio.com \
            --redirect

      # Ticket 050 (Portainer + subdominios) — certificado aparte para los
      # 3 subdominios de infra privilegiada (mismo motivo que el de
      # Jenkins: certbot exige que TODOS los SAN de una misma petición
      # resuelvan, así que van en su propia petición, no junto a los de
      # arriba). continue-on-error: true por si el DNS de alguno de los 3
      # todavía no propagó del todo cuando corre este paso — no bloqueante,
      # igual que el de Jenkins. Idempotente.
      - name: Certificado Let's Encrypt para las 3 herramientas de infra
        continue-on-error: true
        run: |
          sudo certbot --nginx --non-interactive --agree-tos \
            -m marco.cortes@64bitstudio.com \
            -d sonarqube.64bitstudio.com \
            -d traefik.64bitstudio.com \
            -d portainer.64bitstudio.com \
            --redirect

      - name: SonarQube (compartido de la VM)
        run: docker compose -f deploy/vm-infra/sonarqube/docker-compose.yml up -d

      # Ticket 050 (Portainer + subdominios): dashboard web de Docker/
      # Compose, compartido de la VM (no específico de auth-core-mc, mismo
      # criterio que Traefik/SonarQube/Jenkins). Ver
      # deploy/vm-infra/portainer/docker-compose.yml para el riesgo
      # aceptado de docker.sock (mismo ya documentado para Jenkins).
      - name: Portainer (dashboard de Docker/Compose, compartido de la VM)
        run: docker compose -f deploy/vm-infra/portainer/docker-compose.yml up -d

      # Ticket 049 (pivote GH Actions -> Jenkins): bootstrap idempotente
      # de /home/ubuntu/secrets/jenkins/.env (nunca lo pisa si ya existe
      # con un password real puesto por Marco) — mismo patrón que
      # deploy/.env.{dev,qa}.
      - name: Asegurar /home/ubuntu/secrets/jenkins/.env (si falta)
        run: |
          mkdir -p /home/ubuntu/secrets/jenkins
          ENVFILE=/home/ubuntu/secrets/jenkins/.env
          if [ ! -f "$ENVFILE" ]; then
            PW=$(openssl rand -base64 24 | tr -d '=+/\n')
            sed "s#^JENKINS_ADMIN_PASSWORD=.*#JENKINS_ADMIN_PASSWORD=${PW}#" deploy/vm-infra/jenkins/.env.example > "$ENVFILE"
            chmod 600 "$ENVFILE"
            echo "Creado $ENVFILE (password generado, no impreso). GITHUB_PAT queda vacío -- Marco debe llenarlo a mano."
          fi

      # SONAR_TOKEN de Jenkins: se genera solo (vía la API de SonarQube,
      # usando el SONAR_TOKEN de admin que ya vive en los secrets del
      # repo/org) si todavía no hay uno en el .env de Jenkins. Idempotente.
      - name: Asegurar SONAR_TOKEN de Jenkins en /home/ubuntu/secrets/jenkins/.env (si falta)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ENVFILE=/home/ubuntu/secrets/jenkins/.env
          if ! grep -q '^SONAR_TOKEN=.\+' "$ENVFILE"; then
            NEW_TOKEN=$(curl -sS -u "${SONAR_TOKEN}:" -X POST "${SONAR_HOST_URL}/api/user_tokens/generate" \
              --data-urlencode "name=jenkins-ci-$(date +%s)" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
            if [ -z "$NEW_TOKEN" ]; then
              echo "No se pudo generar un token nuevo de SonarQube para Jenkins." >&2
              exit 1
            fi
            sed -i "s#^SONAR_TOKEN=.*#SONAR_TOKEN=${NEW_TOKEN}#" "$ENVFILE"
            echo "SONAR_TOKEN de Jenkins generado y puesto (no impreso)."
          fi

      # Jenkins: necesita construir su propia imagen (Dockerfile con el
      # CLI de docker) y el GID real del grupo dueño de docker.sock EN
      # ESTA VM (puede variar entre hosts, nunca hardcodeado) para que el
      # usuario "jenkins" adentro del contenedor pueda usarlo sin sudo.
      # Hallazgo real (ticket 049, PR #78): "leer un archivo por permiso
      # de grupo" también exige permiso de TRAVERSAL (bit x) en cada
      # directorio del camino, no solo en el archivo final -- ver
      # docs/ARQUITECTURA.md ticket 049 para el detalle completo.
      - name: Permisos de grupo en los secrets de cada proyecto (para Jenkins)
        run: |
          chmod 710 /home/ubuntu/secrets 2>/dev/null || true
          chmod 750 /home/ubuntu/secrets/auth-core-mc 2>/dev/null || true
          chmod 640 /home/ubuntu/secrets/auth-core-mc/.env.* 2>/dev/null || true

      # Hallazgo real (ticket 049, PR #78): este step corría "--build" SIN
      # condición en todo push, recreando (reiniciando) el contenedor de
      # Jenkins en casi cada push -- justo cuando ese mismo push disparaba,
      # en paralelo, un build de Jenkins vía webhook. Se corrige
      # reconstruyendo la imagen solo cuando algo que de verdad la define
      # (Dockerfile o plugins.txt) cambió, comparando contra un hash
      # guardado fuera del checkout. Ver docs/ARQUITECTURA.md ticket 049
      # para el detalle completo.
      - name: Jenkins (orquestador del pipeline, compartido de la VM)
        run: |
          set -a
          . /home/ubuntu/secrets/jenkins/.env
          set +a
          export DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          export UBUNTU_GID=$(id -g ubuntu)

          HASH_FILE=/home/ubuntu/secrets/jenkins/.image-inputs-hash
          NEW_HASH=$(sha256sum deploy/vm-infra/jenkins/Dockerfile deploy/vm-infra/jenkins/plugins.txt | sha256sum | cut -d' ' -f1)
          if [ -f "$HASH_FILE" ] && [ "$(cat "$HASH_FILE")" = "$NEW_HASH" ]; then
            echo "Dockerfile/plugins.txt de Jenkins sin cambios -- 'up -d' sin --build (evita recrear/reiniciar Jenkins en cada push; docker compose igual recrea el contenedor si algo de su config SÍ cambió, p.ej. un GID o un secret nuevo)."
            docker compose -f deploy/vm-infra/jenkins/docker-compose.yml up -d
          else
            echo "Dockerfile/plugins.txt de Jenkins cambiaron (o es la primera corrida) -- reconstruyendo imagen."
            docker compose -f deploy/vm-infra/jenkins/docker-compose.yml up -d --build
            echo "$NEW_HASH" > "$HASH_FILE"
          fi

      # Ticket 049 (pivote GH Actions -> Jenkins): el step "Quality Gate"
      # del Jenkinsfile (waitForQualityGate()) necesita que SonarQube avise
      # a Jenkins cuando termina un análisis -- eso es un webhook
      # configurado DEL LADO DE SONAR, no del lado de Jenkins. Idempotente
      # (busca por nombre antes de crear).
      - name: Webhook de SonarQube -> Jenkins (para el Quality Gate)
        run: |
          SONAR_HOST_URL_LOCAL="http://127.0.0.1:9000"
          SONAR_TOKEN=$(grep '^SONAR_TOKEN=' /home/ubuntu/secrets/jenkins/.env | cut -d= -f2-)
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN vacío en el .env de Jenkins -- se omite (Marco todavía no lo llenó)." >&2
            exit 0
          fi
          EXISTS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL_LOCAL}/api/webhooks/list" | grep -c '"name":"jenkins"' || true)
          if [ "$EXISTS" = "0" ]; then
            curl -s -u "${SONAR_TOKEN}:" -X POST "${SONAR_HOST_URL_LOCAL}/api/webhooks/create" \
              --data-urlencode "name=jenkins" \
              --data-urlencode "url=http://jenkins:8080/sonarqube-webhook/"
          fi

      - name: Notify success (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*✅ [auth-core-mc] infra-sync OK*\nTraefik/SonarQube/Jenkins/Portainer al día en %s (%s).\n%s' "${{ github.ref_name }}" "${{ github.sha }}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*🔴 [auth-core-mc] infra-sync FALLÓ*\nFalló en %s (%s).\n%s' "${{ github.ref_name }}" "${{ github.sha }}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null
