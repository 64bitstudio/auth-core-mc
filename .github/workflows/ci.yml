# Ticket 010: build + tests + análisis de calidad (SonarQube) + notificación
# a Telegram en cada push a cualquier rama.
#
# Ticket 049 — REDISEÑO (2026-08-30, decisión de Marco tras ver la fricción
# real del modelo anterior integracion/main + reviewer): reemplaza el
# modelo anterior de dos ramas (integracion/main) por tres — dev -> qa ->
# prod — y retira el runner self-hosted de la Mac por completo. Se deja
# constancia de la historia (no se borra):
#
#   1) Modelo original (ticket 049, primera versión): integracion (TEST) ->
#      main (PROD con gate manual). Bloqueos reales encontrados y resueltos
#      en el camino: runs-on: self-hosted ambiguo entre el runner de la Mac
#      y vm-oci-runner (fix: runs-on: [self-hosted, macOS]); docker compose
#      ps sin --env-file rompiendo el job de diagnóstico pese a que el
#      deploy real ya había funcionado; IMAGE_TAG (env var de PASO, no del
#      .env.* en disco) faltando en esos mismos pasos de diagnóstico;
#      GitHub Environment con "required reviewers" rechazado por la API
#      (billing plan) y sustituido por workflow_dispatch como gate interino
#      — y una vez el repo pasó a ser público, el mismo Environment SÍ se
#      pudo configurar, pero resultó no proteger nada real: GitHub deja
#      pasar el gate automáticamente a cualquier admin del repo
#      (can_admins_bypass, no configurable) — descubierto en el primer
#      promote-prod real, disparado por Marco, que es admin.
#   2) Este rediseño (segunda versión, la vigente): tres ramas en vez de
#      dos, ningún GitHub Environment (no protegía nada real — el merge
#      manual de Marco a qa/prod ES el gate real ahora), SonarQube se muda
#      de la Mac a esta VM (instancia nueva, sin migrar historial) y el
#      runner de la Mac se retira — con un solo runner (vm-oci) ya no
#      existe la ambigüedad de labels del punto anterior, así que
#      runs-on: [self-hosted, macOS] deja de tener sentido y se simplifica
#      de vuelta a un solo runner en todos los jobs.
#
# Ver docs/ARQUITECTURA.md ticket 049 para el diseño completo y el detalle
# de cada hallazgo.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test-analyze:
    # Runner único de la VM — el de la Mac (marco-mac-auth-core-mc) fue
    # retirado (ver la nota de rediseño arriba). SonarQube también vive
    # ahora en esta VM (deploy/vm-infra/sonarqube), alcanzable en
    # localhost:9000 desde este mismo runner.
    runs-on: [self-hosted, vm-oci]
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube necesita el historial completo (no un shallow clone)
          # para el análisis de "new code"/blame.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build y tests
        working-directory: backend
        run: ./gradlew build

      - name: Análisis SonarQube
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew sonar

      # Falla el job (y por lo tanto el pipeline) si el Quality Gate de
      # SonarQube queda en rojo — sonar.gradle solo ENVÍA el análisis, no
      # espera el resultado del gate por sí mismo. Acción oficial de
      # SonarSource, fijada a un tag de release (no @master) por higiene de
      # cadena de suministro.
      - name: Quality Gate de SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          scanMetadataReportFile: backend/build/sonar/report-task.txt

      # Ticket 049 (rediseño): este runner ya no es la Mac, así que
      # ~/dev-infra/scripts/notify.sh (que solo existe ahí) ya no sirve acá
      # — se cambia al mismo curl directo a la API de Telegram que ya usan
      # build-image/deploy-*, usando los secrets del repo/org.
      - name: Notify success (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*✅ [auth-core-mc] CI OK*\nBuild + tests + Quality Gate OK en %s (%s).\n%s' "${{ github.ref_name }}" "${{ github.sha }}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*🔴 [auth-core-mc] CI FALLÓ*\nFalló en %s (%s).\n%s' "${{ github.ref_name }}" "${{ github.sha }}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

  # Ticket 049 (rediseño) — asegura la infra compartida de la VM (red
  # `edge`, Traefik, SonarQube) en CUALQUIER push, a cualquier rama.
  # Idempotente ("docker compose up -d"/"docker network create" no hacen
  # nada si ya existen) — seguro de correr en cada push, no solo la
  # primera vez.
  #
  # Deliberadamente SIN "needs: build-test-analyze" ni "if" por rama: es
  # justo lo contrario, un prerrequisito de ese job, no una consecuencia —
  # build-test-analyze necesita SonarQube ya arriba en localhost:9000
  # para poder correr el análisis. Si dependiera de build-test-analyze en
  # verde, nunca podría levantar Sonar la primera vez (bloqueo circular
  # real, encontrado en el primer intento de este rediseño: build-test-
  # analyze fallaba porque Sonar no existía todavía en la VM, y Sonar
  # nunca se levantaba porque ese job dependía de build-test-analyze en
  # verde).
  sync-vm-infra:
    if: github.event_name == 'push'
    runs-on: [self-hosted, vm-oci]
    steps:
      - uses: actions/checkout@v4

      - name: Red compartida "edge" (Traefik <-> stacks de cada proyecto)
        run: docker network inspect edge >/dev/null 2>&1 || docker network create edge

      - name: Traefik (ingress compartido de la VM, puertas adentro)
        run: docker compose -f deploy/vm-infra/traefik/docker-compose.yml up -d

      # Hallazgo real (primer intento de este rediseño): la VM ya traía
      # nginx en el puerto 80/443 (paquete de fábrica de Ubuntu) —
      # decisión de Marco: NO deshabilitarlo, se queda como puerta de
      # entrada pública y le hace reverse proxy a Traefik (que por eso
      # publica su entrypoint solo en 127.0.0.1:8000, nunca directo al
      # mundo). Ver docs/ARQUITECTURA.md ticket 049 y
      # deploy/vm-infra/nginx/auth-core-mc.conf para el detalle completo.
      - name: nginx -> Traefik (vhost de auth-core-mc)
        run: |
          sudo cp deploy/vm-infra/nginx/auth-core-mc.conf /etc/nginx/sites-available/auth-core-mc.conf
          sudo ln -sf /etc/nginx/sites-available/auth-core-mc.conf /etc/nginx/sites-enabled/auth-core-mc.conf
          sudo nginx -t
          sudo systemctl reload nginx

      # Certificado real de Let's Encrypt para los 3 subdominios, vía el
      # plugin de nginx de certbot (edita el vhost solo, agrega el bloque
      # 443/ssl + redirect 80->443 — no hace falta versionar esa parte a
      # mano). Idempotente: certbot no reemite si el certificado ya es
      # válido, así que es seguro correr esto en cada push. Requiere que
      # los 3 registros DNS ya resuelvan a esta VM (confirmados por Marco
      # antes de este paso).
      - name: Certificado Let's Encrypt (certbot + nginx)
        run: |
          if ! command -v certbot >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y certbot python3-certbot-nginx
          fi
          sudo certbot --nginx --non-interactive --agree-tos \
            -m marco.cortes@64bitstudio.com \
            -d auth.64bitstudio.com \
            -d auth-qa.64bitstudio.com \
            -d auth-dev.64bitstudio.com \
            --redirect

      - name: SonarQube (compartido de la VM)
        run: docker compose -f deploy/vm-infra/sonarqube/docker-compose.yml up -d

  # Construye la imagen Docker UNA vez, tras tests+Sonar en verde, solo
  # para pushes a `dev` (el merge feature/NNN -> dev es automático cuando
  # este pipeline completo queda verde — ver docs/ARQUITECTURA.md ticket
  # 049).
  build-image:
    needs: build-test-analyze
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: [self-hosted, vm-oci]
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen (tag = SHA del commit)
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "auth-core-mc:${{ github.sha }}" \
            ./backend

      - name: Notify success (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*✅ [auth-core-mc] build-image OK*\nImagen auth-core-mc:%s construida en la VM.\n%s' "${{ github.sha }}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*🔴 [auth-core-mc] build-image FALLÓ*\n%s' "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

  # Ticket 049 (rediseño) — despliega la imagen recién construida al stack
  # DEV (antes "TEST"). deploy/.env.dev vive FUERA del checkout de git, en
  # /home/ubuntu/secrets/auth-core-mc/.env.dev (un self-hosted runner
  # limpia el workspace con `git clean` antes de cada checkout — un archivo
  # gitignored dentro del propio checkout se borraría en cada run). Ver
  # docs/ARQUITECTURA.md ticket 049, sección "Convención de secrets en la
  # VM" — mismo patrón que debe reusar el ticket gemelo de mail-core-mc.
  deploy-dev:
    needs: build-image
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: [self-hosted, vm-oci]
    steps:
      - uses: actions/checkout@v4

      - name: Tag de release para DEV
        run: |
          docker tag "auth-core-mc:${{ github.sha }}" "auth-core-mc-dev:${{ github.sha }}"
          docker tag "auth-core-mc:${{ github.sha }}" "auth-core-mc-dev:current"

      - name: Deploy al stack DEV
        env:
          IMAGE_TAG: current
        run: |
          docker compose \
            -f deploy/docker-compose.dev.yml \
            --env-file /home/ubuntu/secrets/auth-core-mc/.env.dev \
            up -d

      - name: Esperar healthcheck real de /actuator/health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "DEV healthy."
              exit 0
            fi
            echo "Esperando a que DEV quede healthy... ($i/30)"
            sleep 5
          done
          echo "DEV nunca quedó healthy." >&2
          exit 1

      - name: Estado del stack DEV (docker compose ps)
        if: always()
        # IMAGE_TAG es una variable de entorno de este PASO (definida en
        # "Deploy al stack DEV" más arriba), no del .env.dev en disco —
        # GitHub Actions no la hereda entre steps, hay que repetirla aquí
        # (hallazgo real del modelo anterior, ver la nota de rediseño).
        env:
          IMAGE_TAG: current
        run: docker compose -f deploy/docker-compose.dev.yml --env-file /home/ubuntu/secrets/auth-core-mc/.env.dev ps

      - name: Limpieza de imágenes/recursos (retención DEV = 1)
        if: always()
        run: ./deploy/cleanup.sh dev

      - name: Notify success (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*✅ [auth-core-mc] deploy-dev OK*\nDEV corriendo auth-core-mc-dev:%s en la VM.\n%s' "${{ github.sha }}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*🔴 [auth-core-mc] deploy-dev FALLÓ*\n%s' "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

  # Ticket 049 (rediseño) — promueve a QA la MISMA imagen ya validada en
  # DEV (nunca reconstruye: retagea localmente `auth-core-mc-dev:current`,
  # resolviendo su SHA real vía el label
  # `org.opencontainers.image.revision` puesto en build-image — así el job
  # no depende de qué SHA exacto disparó el push a `qa`, que puede diferir
  # del SHA probado en DEV según la estrategia de merge de GitHub, sino de
  # "lo que de verdad está corriendo en DEV ahora mismo").
  #
  # Disparo: push directo a `qa` — es decir, el merge MANUAL de Marco de
  # `dev` a `qa` (nunca automático). No hay GitHub Environment de por
  # medio: ese merge manual ES el gate real (ver la nota de rediseño
  # arriba — el Environment anterior no protegía nada real de todos
  # modos, por el bypass automático a admins).
  deploy-qa:
    needs: build-test-analyze
    if: github.event_name == 'push' && github.ref_name == 'qa'
    runs-on: [self-hosted, vm-oci]
    steps:
      - uses: actions/checkout@v4

      - name: Resolver el SHA actualmente validado en DEV
        id: resolve
        run: |
          SHA=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' auth-core-mc-dev:current)
          if [ -z "$SHA" ]; then
            echo "No se encontró auth-core-mc-dev:current — ¿corrió deploy-dev alguna vez?" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Tag de release para QA (sin rebuild)
        run: |
          docker tag auth-core-mc-dev:current "auth-core-mc-qa:${{ steps.resolve.outputs.sha }}"
          docker tag auth-core-mc-dev:current "auth-core-mc-qa:current"

      - name: Deploy al stack QA
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.sha }}
        run: |
          docker compose \
            -f deploy/docker-compose.qa.yml \
            --env-file /home/ubuntu/secrets/auth-core-mc/.env.qa \
            up -d

      - name: Esperar healthcheck real de /actuator/health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8082/actuator/health | grep -q '"status":"UP"'; then
              echo "QA healthy."
              exit 0
            fi
            echo "Esperando a que QA quede healthy... ($i/30)"
            sleep 5
          done
          echo "QA nunca quedó healthy." >&2
          exit 1

      - name: Estado del stack QA (docker compose ps)
        if: always()
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.sha }}
        run: docker compose -f deploy/docker-compose.qa.yml --env-file /home/ubuntu/secrets/auth-core-mc/.env.qa ps

      - name: Limpieza de imágenes/recursos (retención QA = 1)
        if: always()
        run: ./deploy/cleanup.sh qa

      - name: Notify success (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*✅ [auth-core-mc] deploy-qa OK*\nQA corriendo auth-core-mc-qa:%s en la VM.\n%s' "${{ steps.resolve.outputs.sha }}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*🔴 [auth-core-mc] deploy-qa FALLÓ*\n%s' "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

  # Ticket 049 (rediseño) — promueve a PROD la MISMA imagen ya validada en
  # QA (mismo mecanismo de resolución de SHA que deploy-qa, ahora leyendo
  # el label de `auth-core-mc-qa:current`). Disparo: push directo a `prod`
  # — el merge MANUAL de Marco de `qa` a `prod` (nunca automático). Sin
  # GitHub Environment (ver la nota de rediseño arriba: no protegía nada
  # real — GitHub deja pasar el gate automáticamente a cualquier admin del
  # repo, y Marco es admin).
  deploy-prod:
    needs: build-test-analyze
    if: github.event_name == 'push' && github.ref_name == 'prod'
    runs-on: [self-hosted, vm-oci]
    steps:
      - uses: actions/checkout@v4

      - name: Resolver el SHA actualmente validado en QA
        id: resolve
        run: |
          SHA=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' auth-core-mc-qa:current)
          if [ -z "$SHA" ]; then
            echo "No se encontró auth-core-mc-qa:current — ¿corrió deploy-qa alguna vez?" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Tag de release para PROD (sin rebuild)
        run: |
          docker tag auth-core-mc-qa:current "auth-core-mc-prod:${{ steps.resolve.outputs.sha }}"
          docker tag auth-core-mc-qa:current "auth-core-mc-prod:current"

      - name: Deploy al stack PROD
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.sha }}
        run: |
          docker compose \
            -f deploy/docker-compose.prod.yml \
            --env-file /home/ubuntu/secrets/auth-core-mc/.env.prod \
            up -d

      - name: Esperar healthcheck real de /actuator/health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "PROD healthy."
              exit 0
            fi
            echo "Esperando a que PROD quede healthy... ($i/30)"
            sleep 5
          done
          echo "PROD nunca quedó healthy." >&2
          exit 1

      - name: Estado del stack PROD (docker compose ps)
        if: always()
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.sha }}
        run: docker compose -f deploy/docker-compose.prod.yml --env-file /home/ubuntu/secrets/auth-core-mc/.env.prod ps

      - name: Limpieza de imágenes/recursos (retención PROD = 2)
        if: always()
        run: ./deploy/cleanup.sh prod

      - name: Notify success (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*✅ [auth-core-mc] deploy-prod OK*\nPROD corriendo auth-core-mc-prod:%s en la VM.\n%s' "${{ steps.resolve.outputs.sha }}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*🔴 [auth-core-mc] deploy-prod FALLÓ*\n%s' "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null
