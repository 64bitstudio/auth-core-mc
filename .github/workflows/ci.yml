# Ticket 010: build + tests + análisis de calidad (SonarQube) + notificación
# a Telegram en cada push a cualquier rama.
#
# Por qué "self-hosted", no un runner de GitHub en la nube: SonarQube corre
# localmente en esta máquina (~/dev-infra, http://localhost:9000) — un
# runner en la nube no puede alcanzar ese localhost. Un self-hosted runner
# (sigue siendo GitHub Actions, no un servidor de CI aparte tipo Jenkins) se
# registró y corre como agente de usuario (launchd) en esta Mac — ver
# docs/README.md para cómo reinstalarlo si hace falta. Decisión tomada junto
# al Product Owner (ver docs/ARQUITECTURA.md, ticket 010) tras confirmar que
# un runner en la nube no era viable para este requisito.
#
# Ticket 049: se agregan los jobs `build-image` → `deploy-test` →
# `promote-prod`, que corren en un SEGUNDO runner self-hosted nuevo — la VM
# OCI dedicada, label `vm-oci` (distinto del runner de la Mac) — ver
# docs/ARQUITECTURA.md ticket 049 para el diseño completo (flujo de ramas
# `integracion`/`main`, por qué sin registry externo, retención de
# imágenes, y el gate manual de PROD).
#
# Hallazgo real (ticket 049, tras migrar a la organización 64bitstudio):
# `runs-on: self-hosted` a secas es AMBIGUO en cuanto existe más de un
# runner self-hosted visible para este repo — el de la Mac
# (`marco-mac-auth-core-mc`, repo-level) y `vm-oci-runner` (org-level,
# compartido con mail-core-mc), porque TODO runner self-hosted trae la
# etiqueta genérica "self-hosted" además de la suya propia, y GitHub
# empareja por subconjunto de labels, no por runner exacto. Un run real
# (push a la rama del fix del propio hallazgo del --env-file, ver más abajo)
# lo probó: `build-test-analyze` aterrizó en `vm-oci-runner` y falló —
# SonarQube en `localhost:9000` y `~/dev-infra/scripts/notify.sh` solo
# existen en la Mac. Se cierra el hueco escopeando el job al label
# EXCLUSIVO de la Mac (`macOS`, confirmado vía
# `gh api repos/64bitstudio/auth-core-mc/actions/runners` — el runner de la
# VM es Linux/ARM64 y nunca tendrá ese label), en vez de asumir un nombre.
#
# `promote-prod` se dispara por `workflow_dispatch` (manual), NO
# automáticamente al hacer push a `main` — ver la nota "GATE MANUAL DE PROD"
# más abajo, junto al job, para el porqué (excepción documentada, no un
# parche silencioso: el diseño original pedía un GitHub Environment con
# reviewer requerido; el repo es público, así que si el billing plan lo
# permite ahora se puede agregar el reviewer requerido sin tocar código).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-analyze:
    # Label exclusivo de la Mac — nunca matchea al runner self-hosted de la
    # VM (vm-oci-runner es Linux/ARM64, sin label "macOS"). Ver la nota del
    # hallazgo arriba.
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube necesita el historial completo (no un shallow clone)
          # para el análisis de "new code"/blame.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build y tests
        working-directory: backend
        run: ./gradlew build

      - name: Análisis SonarQube
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew sonar

      # Falla el job (y por lo tanto el pipeline) si el Quality Gate de
      # SonarQube queda en rojo — sonar.gradle solo ENVÍA el análisis, no
      # espera el resultado del gate por sí mismo. Acción oficial de
      # SonarSource, fijada a un tag de release (no @master) por higiene de
      # cadena de suministro.
      - name: Quality Gate de SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          scanMetadataReportFile: backend/build/sonar/report-task.txt

      # Esquema de emoji/título alineado 2026-08-21 con la convención global
      # de notificaciones (ver memoria elite-dev-org-persona): ✅/🔴 y
      # "[proyecto]" en el título. Sigue llamando a notify.sh directo (no al
      # curl+secrets de ~/dev-infra/ci-templates/notify-step.yml) porque este
      # runner es self-hosted y ya tiene ~/dev-infra/.env real en la máquina
      # — duplicar el token/chat_id como secret de GitHub sería redundante.
      - name: Notificar a Telegram
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" = "success" ]; then
            ~/dev-infra/scripts/notify.sh "✅ [auth-core-mc] CI OK" "Build + tests + Quality Gate OK en ${{ github.ref_name }} (${{ github.sha }}). $RUN_URL"
          else
            ~/dev-infra/scripts/notify.sh "🔴 [auth-core-mc] CI FALLÓ" "Falló en ${{ github.ref_name }} (${{ github.sha }}). $RUN_URL"
          fi

  # Ticket 049 — construye la imagen Docker UNA vez, tras tests+Sonar en
  # verde, solo para pushes a `integracion`. Corre en el runner de la VM
  # (`vm-oci`), no en el de la Mac: el daemon Docker que necesita construir
  # y luego correr esta imagen es el de la VM.
  build-image:
    needs: build-test-analyze
    if: github.event_name == 'push' && github.ref_name == 'integracion'
    runs-on: [self-hosted, vm-oci]
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen (tag = SHA del commit)
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "auth-core-mc:${{ github.sha }}" \
            ./backend

      - name: Notify success (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*✅ [auth-core-mc] build-image OK*\nImagen auth-core-mc:%s construida en la VM.\n%s' "${{ github.sha }}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*🔴 [auth-core-mc] build-image FALLÓ*\n%s' "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

  # Ticket 049 — despliega la imagen recién construida al stack TEST.
  # deploy/.env.test vive FUERA del checkout de git, en
  # /home/ubuntu/secrets/auth-core-mc/.env.test (un self-hosted runner
  # limpia el workspace con `git clean` antes de cada checkout — un archivo
  # gitignored dentro del propio checkout se borraría en cada run). Ver
  # docs/ARQUITECTURA.md ticket 049, sección "Convención de secrets en la
  # VM" — mismo patrón que debe reusar el ticket gemelo de mail-core-mc.
  deploy-test:
    needs: build-image
    if: github.event_name == 'push' && github.ref_name == 'integracion'
    runs-on: [self-hosted, vm-oci]
    steps:
      - uses: actions/checkout@v4

      - name: Tag de release para TEST
        run: |
          docker tag "auth-core-mc:${{ github.sha }}" "auth-core-mc-test:${{ github.sha }}"
          docker tag "auth-core-mc:${{ github.sha }}" "auth-core-mc-test:current"

      - name: Deploy al stack TEST
        env:
          IMAGE_TAG: current
        run: |
          docker compose \
            -f deploy/docker-compose.test.yml \
            --env-file /home/ubuntu/secrets/auth-core-mc/.env.test \
            up -d

      - name: Esperar healthcheck real de /actuator/health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "TEST healthy."
              exit 0
            fi
            echo "Esperando a que TEST quede healthy... ($i/30)"
            sleep 5
          done
          echo "TEST nunca quedó healthy." >&2
          exit 1

      - name: Estado del stack TEST (docker compose ps)
        if: always()
        run: docker compose -f deploy/docker-compose.test.yml --env-file /home/ubuntu/secrets/auth-core-mc/.env.test ps

      - name: Limpieza de imágenes/recursos (retención TEST = 1)
        if: always()
        run: ./deploy/cleanup.sh test

      - name: Notify success (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*✅ [auth-core-mc] deploy-test OK*\nTEST corriendo auth-core-mc-test:%s en la VM.\n%s' "${{ github.sha }}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*🔴 [auth-core-mc] deploy-test FALLÓ*\n%s' "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

  # Ticket 049 — promueve a PROD la MISMA imagen ya validada en TEST (nunca
  # reconstruye: retagea localmente `auth-core-mc-test:current`, resolviendo
  # su SHA real vía el label `org.opencontainers.image.revision` puesto en
  # build-image — así el job no depende de qué SHA exacto disparó el push a
  # `main`, que puede diferir del SHA probado en TEST según la estrategia de
  # merge de GitHub, sino de "lo que de verdad está corriendo en TEST ahora
  # mismo"). Ver docs/ARQUITECTURA.md ticket 049 para el detalle completo.
  #
  # === GATE MANUAL DE PROD — EXCEPCIÓN DOCUMENTADA, NO UN PARCHE SILENCIOSO ===
  # El diseño acordado con el Product Owner (ver el ticket 049) pedía un
  # GitHub Environment `prod` con "required reviewers" para pausar este job
  # hasta aprobación manual. Se intentó configurar y la API de GitHub lo
  # rechazó: "Please ensure the billing plan supports the required reviewers
  # protection rule" — ese gate requiere GitHub Pro/Team/Enterprise (o
  # repo público) en un repositorio privado de una cuenta personal, y este
  # repo es privado en un plan gratuito. Mientras el Product Owner decide
  # cómo resolver eso (ver docs/ARQUITECTURA.md ticket 049, "Pendiente de
  # decisión del Product Owner"), este job usa `workflow_dispatch` (disparo
  # 100% manual, nunca automático en push a `main`) como gate interino: nadie
  # sin acceso de escritura al repo puede correrlo, y NADIE lo corre sin una
  # acción humana explícita — cumple la intención de seguridad ("PROD nunca
  # se despliega solo"), aunque no es literalmente el mecanismo que se había
  # descrito. `environment: prod` queda declarado de todos modos: en cuanto
  # el plan de GitHub lo permita, agregar el reviewer requerido ahí no
  # necesita ningún cambio de código.
  promote-prod:
    needs: build-test-analyze
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    runs-on: [self-hosted, vm-oci]
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Resolver el SHA actualmente validado en TEST
        id: resolve
        run: |
          SHA=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' auth-core-mc-test:current)
          if [ -z "$SHA" ]; then
            echo "No se encontró auth-core-mc-test:current — ¿corrió deploy-test alguna vez?" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Tag de release para PROD (sin rebuild)
        run: |
          docker tag auth-core-mc-test:current "auth-core-mc-prod:${{ steps.resolve.outputs.sha }}"

      - name: Deploy al stack PROD
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.sha }}
        run: |
          docker compose \
            -f deploy/docker-compose.prod.yml \
            --env-file /home/ubuntu/secrets/auth-core-mc/.env.prod \
            up -d

      - name: Esperar healthcheck real de /actuator/health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "PROD healthy."
              exit 0
            fi
            echo "Esperando a que PROD quede healthy... ($i/30)"
            sleep 5
          done
          echo "PROD nunca quedó healthy." >&2
          exit 1

      - name: Estado del stack PROD (docker compose ps)
        if: always()
        run: docker compose -f deploy/docker-compose.prod.yml --env-file /home/ubuntu/secrets/auth-core-mc/.env.prod ps

      - name: Limpieza de imágenes/recursos (retención PROD = 2)
        if: always()
        run: ./deploy/cleanup.sh prod

      - name: Notify success (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*✅ [auth-core-mc] promote-prod OK*\nPROD corriendo auth-core-mc-prod:%s en la VM.\n%s' "${{ steps.resolve.outputs.sha }}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null

      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*🔴 [auth-core-mc] promote-prod FALLÓ*\n%s' "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" \
            > /dev/null
