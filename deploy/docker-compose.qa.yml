# Ticket 049 (rediseño dev/qa/prod): stack QA en la VM — segundo ambiente,
# alcanzado por el merge MANUAL de Marco de `dev` a `qa` (nunca
# automático). Recibe la MISMA imagen ya validada en DEV, nunca
# reconstruida (mismo mecanismo de "resolver el SHA real vía el label
# org.opencontainers.image.revision" que ya usaba promote-prod en el
# diseño anterior). Ver docs/ARQUITECTURA.md ticket 049.
#
# "Bajo demanda" igual que DEV — ver deploy/env-ctl.sh.
#
# Nombre de proyecto explícito (auth-core-mc-qa).
name: auth-core-mc-qa

services:
  app:
    image: auth-core-mc-qa:${IMAGE_TAG:?falta IMAGE_TAG (sha del commit a promover)}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: deploy
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth_core_mc
      DB_USER: auth_core_mc
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en deploy/.env.qa}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_BASE_URL: ${APP_BASE_URL:-https://auth-qa.64bitstudio.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-noreply@example.com}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      # Ticket platform/005: AppRole en vez de token estático -- ver
      # docker-compose.dev.yml para el detalle completo del porqué.
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN:-}
      VAULT_TRANSIT_KEY_NAME: ${VAULT_TRANSIT_KEY_NAME:-auth-core-mc-tenant-keys}
      BREAKGLASS_SECRET: ${BREAKGLASS_SECRET:-}
      BREAKGLASS_TOTP_SECRET: ${BREAKGLASS_TOTP_SECRET:-}
      BREAKGLASS_ALLOWED_IPS: ${BREAKGLASS_ALLOWED_IPS:-}
    ports:
      - "8082:8080"
    networks:
      - default
      - edge
      # Ticket platform/005: red interna donde vive Vault -- ver
      # docker-compose.dev.yml para el detalle completo.
      - vm-infra
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.auth-core-mc-qa.rule=Host(`auth-qa.64bitstudio.com`)"
      - "traefik.http.routers.auth-core-mc-qa.entrypoints=web"
      - "traefik.http.services.auth-core-mc-qa.loadbalancer.server.port=8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_core_mc
      POSTGRES_USER: auth_core_mc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en deploy/.env.qa}
    volumes:
      - auth_core_mc_qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_core_mc -d auth_core_mc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - auth_core_mc_qa_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edge:
    external: true
  vm-infra:
    external: true

volumes:
  auth_core_mc_qa_pgdata:
  auth_core_mc_qa_redisdata:
