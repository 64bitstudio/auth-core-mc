# Ticket 049 (rediseño dev/qa/prod): vhost de nginx para los 3 subdominios
# de auth-core-mc. Ver docs/ARQUITECTURA.md ticket 049 para el porqué de
# esta topología (nginx en 80/443, Traefik puertas adentro en
# 127.0.0.1:8000) — decisión de Marco de mantener el nginx de fábrica de
# la VM en vez de deshabilitarlo.
#
# Solo HTTP por ahora (puerto 80) — SIN bloque 443/ssl todavía: los
# registros DNS (auth[.-qa][-dev].64bitstudio.com -> 159.54.153.37) los
# tiene que crear Marco primero (no hay token de API de Cloudflare
# disponible para hacerlo automático). Con el DNS resuelto, correr
#   sudo certbot --nginx -d auth.64bitstudio.com -d auth-qa.64bitstudio.com -d auth-dev.64bitstudio.com
# en la VM agrega el bloque 443/ssl (certificado SAN único para los 3
# subdominios) y el redirect 80->443 automáticamente — no hace falta
# volver a tocar este archivo a mano para eso.
#
# nginx reenvía TODO (incluida cualquier ruta /.well-known/acme-challenge/
# que certbot necesite) al Traefik interno — Traefik nunca es alcanzable
# desde fuera de esta VM directamente (ver docker-compose.yml de Traefik,
# publicado solo en 127.0.0.1:8000).
server {
    listen 80;
    listen [::]:80;
    server_name auth.64bitstudio.com auth-qa.64bitstudio.com auth-dev.64bitstudio.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
