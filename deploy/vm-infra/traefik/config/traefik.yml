# Ticket 049 (rediseño dev/qa/prod) — config estática de Traefik, ingress
# compartido de la VM. Ver docker-compose.yml en este mismo directorio para
# el porqué de cada decisión (TLS sin depender de Cloudflare, volumen
# nombrado para acme.json, etc.).

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    # Nada se expone por default con solo conectarse a la red `edge` — cada
    # servicio tiene que declarar "traefik.enable=true" explícitamente (ver
    # las labels en deploy/docker-compose.{dev,qa,prod}.yml). Evita que un
    # contenedor futuro quede enrutado por accidente.
    exposedByDefault: false
    network: edge
    watch: true

certificatesResolvers:
  le:
    acme:
      email: marco.cortes@64bitstudio.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# Dashboard/API deliberadamente NO habilitado (sin "api: {dashboard: true,
# insecure: true}") — no hay todavía una decisión de a qué hostname/auth
# quedaría expuesto. Habilitarlo más adelante es un cambio de config, no de
# arquitectura.

log:
  level: INFO
