# Ticket 049 (rediseño dev/qa/prod): ingress compartido de TODA la VM, no
# solo de auth-core-mc — Traefik enruta por Host() hacia cualquier stack
# que se conecte a la red externa `edge` con las labels correctas. Vive en
# el repo de auth-core-mc por ser el primer proyecto en configurarlo (mismo
# patrón ya usado para el runner self-hosted de la VM: se documenta y
# versiona aquí, pero es infraestructura de la VM, no de este proyecto en
# particular). El ticket gemelo de mail-core-mc debe REUSAR esta instancia
# (agregar sus propias labels a su propio stack, conectarse a la misma red
# `edge`) — no levantar un segundo Traefik.
#
# TLS: Let's Encrypt vía challenge HTTP-01 (certResolver "le", ver
# traefik.yml) — NO depende de un token de API de Cloudflare (no había
# ninguno disponible al montar esto). Requiere que los 3 registros DNS
# (auth.64bitstudio.com, auth-qa.64bitstudio.com, auth-dev.64bitstudio.com)
# apunten a esta VM (159.54.153.37) en modo "DNS only" (nube gris, sin
# proxy de Cloudflare) — con proxy activado (nube naranja) el challenge
# HTTP-01 puede seguir funcionando si el modo SSL/TLS de Cloudflare es
# compatible, pero no se asumió ni se probó; queda pendiente de decisión
# explícita si Marco prefiere activar el proxy de Cloudflare.
#
# acme.json vive en un volumen NOMBRADO (no un bind mount dentro del
# checkout de git): el runner self-hosted hace "git clean -ffdx" antes de
# cada checkout, lo que borraría cualquier archivo dentro del workspace en
# cada run — mismo motivo ya documentado para los secrets de deploy.
name: vm-infra-traefik

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  traefik_letsencrypt:
