spring.application.name=AuthCoreMc

# Resend (transactional email) — set RESEND_API_KEY in the environment/.env
# before triggering any email-sending flow; see docs/README.md.
resend.api-key=${RESEND_API_KEY:}
resend.from-address=${RESEND_FROM_ADDRESS:noreply@example.com}

# Base URL used to build links sent in verification/change-email/reset emails.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Twilio (SMS) — set these before triggering any SMS-sending flow (password
# reset for phone-only accounts, OTP in ticket 005); see docs/README.md.
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

# Vault Transit (envelope encryption for tenant secrets, ticket 017) — set
# VAULT_ADDR/VAULT_ROOT_TOKEN in the environment/.env (dev-infra/.env
# locally) before configuring any tenant's identity-provider secrets; see
# docs/ARQUITECTURA.md ticket 017.
vault.address=${VAULT_ADDR:http://localhost:8200}
vault.token=${VAULT_ROOT_TOKEN:}
vault.transit-key-name=${VAULT_TRANSIT_KEY_NAME:auth-core-mc-tenant-keys}

# Break-glass (ticket 018) — emergency admin access, independent of
# AuthController/OAuth2 (see BreakGlassService). Empty by default, which
# means the mechanism refuses ALL requests (never fail-open) until an
# operator sets all three of BREAKGLASS_SECRET/BREAKGLASS_TOTP_SECRET/
# BREAKGLASS_ALLOWED_IPS in the environment/.env. BREAKGLASS_ALLOWED_IPS
# is a comma-separated list of exact IPs (no CIDR ranges yet — see
# docs/ARQUITECTURA.md ticket 018). BREAKGLASS_TOTP_SECRET is its own
# base32 secret (Totp.generateSecret()), unrelated to any user's 2FA.
breakglass.secret=${BREAKGLASS_SECRET:}
breakglass.totp-secret=${BREAKGLASS_TOTP_SECRET:}
breakglass.allowed-ips=${BREAKGLASS_ALLOWED_IPS:}
