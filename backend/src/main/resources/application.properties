spring.application.name=AuthCoreMc

# Resend (transactional email) — set RESEND_API_KEY in the environment/.env
# before triggering any email-sending flow; see docs/README.md.
resend.api-key=${RESEND_API_KEY:}
resend.from-address=${RESEND_FROM_ADDRESS:noreply@example.com}

# Base URL used to build links sent in verification/change-email/reset emails.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Twilio (SMS) — set these before triggering any SMS-sending flow (password
# reset for phone-only accounts, OTP in ticket 005); see docs/README.md.
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

# Vault Transit (envelope encryption for tenant secrets, ticket 017).
# Ticket platform/005: deployed environments (DEV/QA/PROD) authenticate
# via AppRole -- set VAULT_ADDR/VAULT_ROLE_ID/VAULT_SECRET_ID (VAULT_ADDR
# and VAULT_ROLE_ID are not secret; VAULT_SECRET_ID is injected at deploy
# time by corePipeline.groovy, same mechanism as DB_PASSWORD). Their own
# docker-compose.{dev,qa,prod}.yml sets these explicitly from Vault-synced
# secrets, so the defaults below (meant for local dev) never apply there.
#
# Ticket auth-core-mc/051 (platform/007): local dev in the Mac dropped its
# own Vault (~/dev-infra) and now points at the same VM Vault the deployed
# environments use, via a SEPARATE least-privilege AppRole
# ("auth-core-mc-local-dev", see
# platform/deploy/vm-infra/vault/bootstrap-auth-core-mc-local-dev-approle.sh)
# -- revocable independently from "auth-core-mc-backend" without touching
# DEV/QA/PROD. Reached over vault.64bitstudio.com (nginx allowlists only
# the 3 routes this AppRole needs, no shared Basic Auth on top -- see
# platform's nginx/vault.conf). Both VAULT_ADDR/VAULT_ROLE_ID empty (or
# unreachable) = TenantIdentityProviderService fails loudly if a tenant
# tries to configure a social secret; see docs/ARQUITECTURA.md ticket
# 017/005/051. vault.role-id defaults to the real, non-secret RoleID of
# "auth-core-mc-local-dev" -- same rationale as Jenkins hardcoding its own
# RoleID in corePipeline.groovy: a RoleID means nothing without the
# SecretID, so it isn't treated as a secret. vault.secret-id has no
# default (it IS secret) -- set VAULT_SECRET_ID in backend/.env (gitignored,
# never committed). vault.token/VAULT_ROOT_TOKEN is kept as a legacy
# fallback in VaultTransitEncryptor for anyone still pointing vault.address
# at a token-based Vault, but nothing in this project provisions one
# anymore since the local Vault was retired.
vault.address=${VAULT_ADDR:https://vault.64bitstudio.com}
vault.role-id=${VAULT_ROLE_ID:8f57acaa-6685-e870-1de6-fb9d8aad1e27}
vault.secret-id=${VAULT_SECRET_ID:}
vault.token=${VAULT_ROOT_TOKEN:}
vault.transit-key-name=${VAULT_TRANSIT_KEY_NAME:auth-core-mc-tenant-keys}

# Break-glass (ticket 018) — emergency admin access, independent of
# AuthController/OAuth2 (see BreakGlassService). Empty by default, which
# means the mechanism refuses ALL requests (never fail-open) until an
# operator sets all three of BREAKGLASS_SECRET/BREAKGLASS_TOTP_SECRET/
# BREAKGLASS_ALLOWED_IPS in the environment/.env. BREAKGLASS_ALLOWED_IPS
# is a comma-separated list of exact IPs (no CIDR ranges yet — see
# docs/ARQUITECTURA.md ticket 018). BREAKGLASS_TOTP_SECRET is its own
# base32 secret (Totp.generateSecret()), unrelated to any user's 2FA.
breakglass.secret=${BREAKGLASS_SECRET:}
breakglass.totp-secret=${BREAKGLASS_TOTP_SECRET:}
breakglass.allowed-ips=${BREAKGLASS_ALLOWED_IPS:}
