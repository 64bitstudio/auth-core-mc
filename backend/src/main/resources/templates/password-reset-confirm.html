<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restablecer contraseña</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
  <!--
    No tenant theming here on purpose: the emailed link only carries a
    one-use token, not a client_id — and a tenant can have more than one
    identity_client, so there's no single reliable app_name/primary_color
    to attach to a bare token. See docs/ARQUITECTURA.md ticket 009.
  -->
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="app-header">
    <span th:replace="~{fragments/icons :: icon-restablecer-password}"></span>
    <h1>Restablecer contraseña</h1>
  </header>
  <main id="main">
    <div id="status" class="hidden" aria-live="polite"></div>
    <!-- Ticket 032: see api.js's showStatus() comment for why this
         per-page <template> exists. -->
    <template id="status-icons">
      <span data-status-icon="exito" th:insert="~{fragments/icons :: icon-exito}"></span>
      <span data-status-icon="error" th:insert="~{fragments/icons :: icon-error}"></span>
    </template>

    <form id="reset-confirm-form" novalidate>
      <div>
        <label class="field-label" for="new-password"><span th:replace="~{fragments/icons :: icon-password}"></span>Nueva contraseña</label>
        <input type="password" id="new-password" name="newPassword" aria-label="Nueva contraseña" required autocomplete="new-password" minlength="8" aria-describedby="password-hint" />
        <p class="field-hint" id="password-hint">Mínimo 8 caracteres, con al menos una letra y un dígito.</p>
      </div>
      <button type="submit">Restablecer contraseña</button>
    </form>
  </main>

  <script th:src="@{/js/api.js}"></script>
  <script>
    document.getElementById("reset-confirm-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      const token = AuthCoreUi.tokenFromUrl();
      if (!token) {
        AuthCoreUi.showStatus(status, "Falta el token del enlace. Usa el enlace del correo recibido.", true);
        return;
      }
      try {
        await AuthCoreUi.withBusy(e.submitter, async () => {
          await fetch("/api/v1/password-reset/confirm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, newPassword: e.target.newPassword.value }),
          }).then(async (res) => {
            const data = await res.json().catch(() => null);
            if (!res.ok) {
              throw new Error((data && data.message) || `Error ${res.status}`);
            }
          });
          AuthCoreUi.showStatus(status, "Contraseña restablecida. Ya puedes iniciar sesión.", false);
        });
      } catch (err) {
        AuthCoreUi.showStatus(status, err.message, true);
      }
    });
  </script>
</body>
</html>
