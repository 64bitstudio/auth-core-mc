<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:attr="style='--primary-color:' + ${primaryColor} + ';'">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${appName} + ' — Iniciar sesión'">Iniciar sesión</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="app-header"><h1 th:text="${appName}">App</h1></header>
  <main id="main">
    <div class="card-title">
      <span th:replace="~{fragments/icons :: icon-logins-totales}"></span>
      <h2>Iniciar sesión</h2>
    </div>
    <div id="status" class="hidden" aria-live="polite"></div>
    <!-- Ticket 032: see api.js's showStatus() comment for why this
         per-page <template> exists. -->
    <template id="status-icons">
      <span data-status-icon="exito" th:insert="~{fragments/icons :: icon-exito}"></span>
      <span data-status-icon="error" th:insert="~{fragments/icons :: icon-error}"></span>
    </template>

    <form id="login-form" novalidate>
      <div>
        <label class="field-label" for="identifier"><span th:replace="~{fragments/icons :: icon-mi-cuenta}"></span>Correo o teléfono</label>
        <input type="text" id="identifier" name="identifier" aria-label="Correo o teléfono" required autocomplete="username" />
      </div>
      <div>
        <label class="field-label" for="password"><span th:replace="~{fragments/icons :: icon-password}"></span>Contraseña</label>
        <input type="password" id="password" name="password" aria-label="Contraseña" required autocomplete="current-password" />
      </div>
      <button type="submit">Entrar</button>
    </form>

    <!-- Ticket 039: docs/definiciones/login-social-real.md (HU-1, HU-9).
         Botones visibles solo si el tenant tiene el proveedor `enabled`
         (UiPagesController#addSocialLoginAttributes) — nunca un botón que
         llevaría a un /oauth2/authorization/** fallido para un proveedor
         deshabilitado. -->
    <div class="social-login" th:if="${googleEnabled} or ${facebookEnabled}">
      <p class="divider">o</p>
      <a th:if="${googleEnabled}" class="button-social" th:href="${googleAuthorizationUrl}">
        <span th:replace="~{fragments/icons :: logo-google}"></span>
        Iniciar sesión con Google
      </a>
      <a th:if="${facebookEnabled}" class="button-social" th:href="${facebookAuthorizationUrl}">
        <span th:replace="~{fragments/icons :: logo-facebook}"></span>
        Iniciar sesión con Facebook
      </a>
    </div>

    <!-- Ticket 046: paso intermedio de 2FA, oculto hasta que /api/v1/login
         responda 202 twoFactorRequired (ticket 045) — ver fragments/two-factor-step.html. -->
    <div th:replace="~{fragments/two-factor-step :: step}"></div>

    <nav class="links">
      <a th:href="@{/ui/password-reset/request(client_id=${clientId})}">¿Olvidaste tu contraseña?</a><br />
      <a th:href="@{/ui/register(client_id=${clientId})}">¿No tienes cuenta? Regístrate</a>
    </nav>
  </main>

  <script th:src="@{/js/api.js}"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      const form = e.target;
      const body = { identifier: form.identifier.value, password: form.password.value };
      try {
        await AuthCoreUi.withBusy(e.submitter, async () => {
          const result = await AuthCoreUi.call("/api/v1/login", body);
          // Ticket 046: el usuario tiene 2FA activo (ticket 045) — no hay
          // tokens todavía, se completa el paso intermedio antes de seguir.
          if (result.twoFactorRequired) {
            form.classList.add("hidden");
            const socialLogin = document.querySelector(".social-login");
            if (socialLogin) socialLogin.classList.add("hidden");
            AuthCoreUi.startTwoFactorStep(result.pendingToken, result.method, status, (verifyResult) => {
              AuthCoreUi.saveSession(verifyResult.user, verifyResult.tokens);
              AuthCoreUi.showStatus(status, "Sesión iniciada. Redirigiendo…", false);
              window.location.href = "/ui/cuenta?client_id=" + encodeURIComponent(AuthCoreUi.clientIdFromUrl());
            });
            return;
          }
          AuthCoreUi.saveSession(result.user, result.tokens);
          AuthCoreUi.showStatus(status, "Sesión iniciada. Redirigiendo…", false);
          window.location.href = "/ui/cuenta?client_id=" + encodeURIComponent(AuthCoreUi.clientIdFromUrl());
        });
      } catch (err) {
        AuthCoreUi.showStatus(status, err.message, true);
      }
    });

    // Ticket 039: SocialLoginFailureHandler (ticket 037) redirects aquí con
    // ?error=social_login_cancelled cuando el usuario cancela/niega el
    // consentimiento en Google/Facebook (HU-3) — mismo showStatus() que
    // cualquier otro error de esta página, ningún mecanismo nuevo.
    (() => {
      const error = new URLSearchParams(window.location.search).get("error");
      if (error === "social_login_cancelled") {
        AuthCoreUi.showStatus(
          document.getElementById("status"),
          "Inicio de sesión cancelado. Puedes intentarlo de nuevo o usar tu correo y contraseña.",
          true,
        );
      }
    })();
  </script>
</body>
</html>
