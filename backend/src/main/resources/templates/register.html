<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:attr="style='--primary-color:' + ${primaryColor} + ';'">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${appName} + ' — Crear cuenta'">Crear cuenta</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="app-header"><h1 th:text="${appName}">App</h1></header>
  <main id="main">
    <div class="card-title">
      <span th:replace="~{fragments/icons :: icon-crear-cuenta}"></span>
      <h2>Crear cuenta</h2>
    </div>
    <div id="status" class="hidden" aria-live="polite"></div>
    <!-- Ticket 032: see api.js's showStatus() comment for why this
         per-page <template> exists. -->
    <template id="status-icons">
      <span data-status-icon="exito" th:insert="~{fragments/icons :: icon-exito}"></span>
      <span data-status-icon="error" th:insert="~{fragments/icons :: icon-error}"></span>
    </template>

    <form id="register-form" novalidate>
      <div>
        <label class="field-label" for="email"><span th:replace="~{fragments/icons :: icon-correo}"></span>Correo</label>
        <input type="email" id="email" name="email" aria-label="Correo" autocomplete="email" aria-describedby="identifier-hint" />
        <p class="field-hint" id="identifier-hint">Ingresa correo o teléfono (al menos uno de los dos).</p>
      </div>
      <div>
        <label class="field-label" for="phone"><span th:replace="~{fragments/icons :: icon-telefono}"></span>Teléfono</label>
        <input type="tel" id="phone" name="phone" aria-label="Teléfono" autocomplete="tel" aria-describedby="identifier-hint" />
      </div>
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" aria-label="Nombre" required autocomplete="given-name" />
      </div>
      <div>
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos" aria-label="Apellidos" required autocomplete="family-name" />
      </div>
      <div>
        <label class="field-label" for="password"><span th:replace="~{fragments/icons :: icon-password}"></span>Contraseña</label>
        <input type="password" id="password" name="password" aria-label="Contraseña" required autocomplete="new-password" minlength="8" aria-describedby="password-hint" />
        <p class="field-hint" id="password-hint">Mínimo 8 caracteres, con al menos una letra y un dígito.</p>
      </div>
      <button type="submit">Crear cuenta</button>
    </form>

    <!-- Ticket 039: docs/definiciones/login-social-real.md (HU-1, HU-9).
         Un login social exitoso con un correo nuevo crea la cuenta
         directamente (registro implícito) — mismo botón/texto/condición
         de visibilidad que login.html, ver el comentario ahí. -->
    <div class="social-login" th:if="${googleEnabled} or ${facebookEnabled}">
      <p class="divider">o</p>
      <a th:if="${googleEnabled}" class="button-social" th:href="${googleAuthorizationUrl}">
        <span th:replace="~{fragments/icons :: logo-google}"></span>
        Iniciar sesión con Google
      </a>
      <a th:if="${facebookEnabled}" class="button-social" th:href="${facebookAuthorizationUrl}">
        <span th:replace="~{fragments/icons :: logo-facebook}"></span>
        Iniciar sesión con Facebook
      </a>
    </div>

    <nav class="links">
      <a th:href="@{/ui/login(client_id=${clientId})}">¿Ya tienes cuenta? Inicia sesión</a>
    </nav>
  </main>

  <script th:src="@{/js/api.js}"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      const form = e.target;
      const body = {
        email: form.email.value || null,
        phone: form.phone.value || null,
        nombre: form.nombre.value,
        apellidos: form.apellidos.value,
        password: form.password.value,
      };
      try {
        await AuthCoreUi.withBusy(e.submitter, async () => {
          const user = await AuthCoreUi.call("/api/v1/register", body);
          AuthCoreUi.saveSession(user);
          AuthCoreUi.showStatus(status, "Cuenta creada. Redirigiendo…", false);
          window.location.href = "/ui/cuenta?client_id=" + encodeURIComponent(AuthCoreUi.clientIdFromUrl());
        });
      } catch (err) {
        AuthCoreUi.showStatus(status, err.message, true);
      }
    });
  </script>
</body>
</html>
