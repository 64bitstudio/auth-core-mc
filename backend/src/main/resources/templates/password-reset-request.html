<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:attr="style='--primary-color:' + ${primaryColor} + ';'">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${appName} + ' — Recuperar contraseña'">Recuperar contraseña</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="app-header"><h1 th:text="${appName}">App</h1></header>
  <main id="main">
    <h2>Recuperar contraseña</h2>
    <div id="status" class="hidden" aria-live="polite"></div>
    <p class="field-hint">
      Si el correo o teléfono existe en nuestro sistema, te enviaremos instrucciones para restablecer tu contraseña.
    </p>

    <form id="reset-request-form" novalidate>
      <div>
        <label for="identifier">Correo o teléfono</label>
        <input type="text" id="identifier" name="identifier" aria-label="Correo o teléfono" required autocomplete="username" />
      </div>
      <button type="submit">Enviar instrucciones</button>
    </form>

    <nav class="links">
      <a th:href="@{/ui/login(client_id=${clientId})}">Volver a iniciar sesión</a>
    </nav>
  </main>

  <script th:src="@{/js/api.js}"></script>
  <script>
    document.getElementById("reset-request-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      try {
        await AuthCoreUi.call("/api/v1/password-reset/request", { identifier: e.target.identifier.value });
        // Always the same message, success or not — the API itself never
        // reveals whether the identifier exists (see docs/API.md); showing
        // a different message here for an unknown identifier would leak
        // exactly what that design was built to hide.
        AuthCoreUi.showStatus(status, "Si el dato existe, recibirás instrucciones en breve.", false);
      } catch (err) {
        AuthCoreUi.showStatus(status, err.message, true);
      }
    });
  </script>
</body>
</html>
