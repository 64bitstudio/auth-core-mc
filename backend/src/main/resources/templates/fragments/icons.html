<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <!--
    Ticket 024: shared SVG icon set for the admin panel ("Slate +
    Índigo"), one th:fragment per icon so any admin page can pull one in
    via th:replace="~{fragments/icons :: icon-xyz}" — same reuse pattern
    as fragments/admin-shell.html's topbar/sidenav/script fragments.

    Markup is copied literal from the ux-ui-designer's delivery, not
    reinterpreted. Shared conventions across the line-icon family:
    viewBox="0 0 24 24", stroke="currentColor" (so the icon inherits the
    color of its containing element — hover/active/focus already defined
    in admin.css recolor the icon for free, no extra CSS needed), and
    aria-hidden="true" focusable="false" by default since every icon in
    this ticket's scope is used next to visible text (sidenav links).

    Two exceptions to that shared viewBox: illus-vacio (own viewBox,
    120x100, uses var(--admin-*) custom properties directly instead of
    currentColor since it's multi-color) and the two brand logos
    (own viewBox, true brand colors, no stroke).
  -->

  <svg th:fragment="icon-inicio" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M4 10.5 12 4l8 6.5" />
    <path d="M5.5 9.5V19a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5" />
    <path d="M9.5 20v-5.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V20" />
  </svg>

  <svg th:fragment="icon-clientes" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <rect x="5" y="3.5" width="14" height="17" rx="1" />
    <path d="M10.5 20.5v-4a1.5 1.5 0 0 1 3 0v4" />
    <path d="M8.5 8h1.5M14 8h1.5M8.5 12.5h1.5M14 12.5h1.5" />
  </svg>

  <svg th:fragment="icon-metricas" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M4 4v16h16" />
    <rect x="7" y="13" width="3" height="7" rx="0.5" />
    <rect x="12" y="9" width="3" height="11" rx="0.5" />
    <rect x="17" y="5" width="3" height="15" rx="0.5" />
  </svg>

  <svg th:fragment="icon-proveedores" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M9 3v5M15 3v5" />
    <path d="M6.5 8h11v2.5a5.5 5.5 0 0 1-11 0z" />
    <path d="M12 16v4" />
    <path d="M8.5 20.5h7" />
  </svg>

  <svg th:fragment="icon-logins-totales" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M15 4h3.5a1.5 1.5 0 0 1 1.5 1.5v13a1.5 1.5 0 0 1-1.5 1.5H15" />
    <path d="M4 12h11.5" />
    <path d="M12 8.5 15.5 12 12 15.5" />
  </svg>

  <svg th:fragment="icon-usuarios-activos" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <circle cx="11" cy="8" r="3.25" />
    <path d="M5.5 20v-1.5A4.5 4.5 0 0 1 10 14h2a4.5 4.5 0 0 1 3.68 1.92" />
    <circle cx="18.5" cy="17.5" r="3" />
    <path d="M17.1 17.5l1 1 2-2" />
  </svg>

  <svg th:fragment="icon-usuarios-registrados" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <circle cx="9" cy="8" r="3.25" />
    <path d="M3.5 20v-1.25A4.75 4.75 0 0 1 8.25 14h1.5A4.75 4.75 0 0 1 14.5 18.75V20" />
    <circle cx="16.5" cy="8.5" r="2.5" />
    <path d="M14.75 14.1a4.25 4.25 0 0 1 6 3.9v2" />
  </svg>

  <svg th:fragment="icon-latencia" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M9.5 3h5" />
    <path d="M12 3v2.5" />
    <path d="M17.6 8.4 19.4 6.6" />
    <circle cx="12" cy="14" r="8" />
    <path d="M12 10.5V14l3 2" />
  </svg>

  <svg th:fragment="icon-tasa" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <circle cx="7" cy="7" r="2.5" />
    <circle cx="17" cy="17" r="2.5" />
    <path d="M18 6 6 18" />
  </svg>

  <svg th:fragment="icon-exito" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="8.5" />
    <path d="M8.5 12.5l2.5 2.5 5-5.5" />
  </svg>

  <svg th:fragment="icon-error" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="8.5" />
    <path d="M12 7.75v5" />
    <path d="M12 16.25h.01" />
  </svg>

  <!--
    Ticket 031: icon-editar / icon-desactivar / icon-reactivar back the
    compact icon+text row-action buttons on /uid/admin/tenants (edit /
    deactivate / reactivate a tenant). Same shared conventions as the rest
    of this file (viewBox 0 0 24 24, stroke="currentColor", aria-hidden),
    but these three are pulled into admin-tenants.html via a hidden
    <template> instead of a direct th:replace per row, because those rows
    are assembled in JS (loadTenants() builds one <tr> per tenant from an
    API response) rather than rendered by Thymeleaf per row — see the
    <template id="icon-*-tpl"> elements near the top of that page.
    icon-desactivar/icon-reactivar reuse the same circle (r=8.5) as
    icon-exito/icon-error above for visual consistency within the set,
    with a minus/plus glyph inside to read as "turn off"/"turn back on".
  -->
  <svg th:fragment="icon-editar" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M12 20h8" />
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5z" />
  </svg>

  <svg th:fragment="icon-desactivar" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="8.5" />
    <path d="M8 12h8" />
  </svg>

  <svg th:fragment="icon-reactivar" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="8.5" />
    <path d="M12 8v8" />
    <path d="M8 12h8" />
  </svg>

  <svg th:fragment="illus-vacio" viewBox="0 0 120 100" width="120" height="100" aria-hidden="true" focusable="false">
    <ellipse cx="60" cy="80" rx="34" ry="4" fill="var(--admin-border)" opacity="0.5"/>
    <path d="M26 38 L34 76 L86 76 L94 38 Z" fill="var(--admin-surface)" stroke="var(--admin-border-strong)" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="60" cy="38" rx="34" ry="9" fill="var(--admin-accent-soft)" stroke="var(--admin-border-strong)" stroke-width="2"/>
    <path d="M42 52h36" stroke="var(--admin-border-strong)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 6"/>
    <circle cx="86" cy="24" r="11" fill="var(--admin-accent-soft)" stroke="var(--admin-accent)" stroke-width="2.5"/>
    <path d="M94.5 32.5 L102 40" stroke="var(--admin-accent)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M18 20v6M15 23h6" stroke="var(--admin-accent)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="103" cy="64" r="2.5" fill="var(--admin-accent-soft)"/>
  </svg>

  <svg th:fragment="logo-google" viewBox="0 0 18 18" width="24" height="24" aria-hidden="true" focusable="false">
    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
    <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
  </svg>

  <svg th:fragment="logo-facebook" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
    <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
  </svg>
</body>
</html>
