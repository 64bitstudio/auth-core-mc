  <!--
    ==========================================================================
    Ticket 032: audit + expansion of icon/illustration coverage across the
    rest of the admin panel and the 7 end-user auth pages (login, register,
    cuenta, password-reset-request/confirm, verify-email-confirm,
    change-email-confirm) — the latter got a full visual redesign in ticket
    023 but shipped with zero iconography. Decided by ux-ui-designer, same
    process as ticket 024: markup below is the literal delivery, not a
    suggestion for frontend-dev to reinterpret.

    Every new icon below stays inside the SAME line-icon family already
    established (viewBox 24x24, stroke="currentColor", stroke-width="1.75",
    round caps/joins, fill="none") — deliberately ONE icon language for the
    whole app, admin panel and end-user pages alike, not a second visual
    system. That's why e.g. login.html's header reuses icon-logins-totales
    verbatim instead of drawing a near-duplicate "door with an arrow" glyph
    under a different name — the fragment name is an internal admin-metrics
    artifact, the glyph itself is a generic "iniciar sesión" pictogram and
    reusing it is more consistent (and lighter) than a lookalike twin.

    All 24x24 icons below are purely decorative — aria-hidden="true"
    focusable="false" — because every single one sits directly next to
    visible text (an h2/h1 title, a <label>, a <h3> card title). None of
    them replace text or convey information unavailable elsewhere.

    Placement/wiring decisions for frontend-dev (do not improvise a
    different layout — these were evaluated with tradeoffs, not defaults):

    1) PAGE-HEADER ICONS reuse the exact `.card-title` flex pattern already
       in admin.css (icon + text, gap ~0.6rem, icon un-scaled at its native
       24x24) — do not invent a new `.page-header-icon` class, just apply
       that existing rule to h1/h2 the same way admin-identity-providers.html
       already applies it to h3+logo.
         - admin-home.html      h2 "Bienvenido…"      -> icon-inicio (reuse)
         - admin-tenants.html   h2 "Todos los clientes" -> icon-clientes (reuse)
         - admin-metrics.html   h2 "Métricas de uso"    -> icon-metricas (reuse)
         - admin-identity-providers.html h2             -> icon-proveedores (reuse)
       Reusing the SAME icon already shown for that section in the sidenav is
       intentional "you are here" wayfinding, not a missed opportunity for a
       distinct glyph — it reinforces which nav item is active instead of
       introducing a second, unrelated pictogram for the same destination.
         - login.html            h2 "Iniciar sesión"    -> icon-logins-totales (reuse)
         - register.html         h2 "Crear cuenta"      -> icon-crear-cuenta (new)
         - cuenta.html           h2 "Mi cuenta"          -> icon-mi-cuenta (new)
         - password-reset-request.html h2 "Recuperar contraseña" -> icon-restablecer-password (new)
       The 3 email-link confirm pages (password-reset-confirm, verify-email-confirm,
       change-email-confirm) have NO h2 — their <h1> inside header.app-header
       IS the page title (no tenant/app name available on a bare token link,
       see each file's own "No tenant theming" comment). Their icon goes next
       to that <h1> instead, as one more flex child of header.app-header
       (already `display:flex; align-items:center; gap:0.6rem` — the existing
       `::before` accent dot is untouched, the icon is simply a sibling
       between the dot and the <h1> text):
         - password-reset-confirm.html h1 -> icon-restablecer-password (reuse,
           same glyph as the request step — deliberate continuity across the
           2-step flow, not two near-identical "key" icons)
         - verify-email-confirm.html   h1 -> icon-verificacion-correo (reuse,
           same glyph as cuenta.html's "Verificación de correo" card)
         - change-email-confirm.html   h1 -> icon-cambiar-correo (reuse,
           same glyph as cuenta.html's "Cambiar correo" card)

    2) CUENTA.HTML CARD-TITLE ICONS — same `.card-title` pattern, paired
       with each section's existing <h3>:
         - "Panel de administración" -> icon-panel-admin (new)
         - "Verificación de correo"  -> icon-verificacion-correo (new)
         - "Cambiar correo"          -> icon-cambiar-correo (new)
         - "Verificación en dos pasos (2FA)" -> icon-2fa (new — deliberately
           NOT a reuse of icon-proveedores: that glyph already means "OAuth
           social providers" in the admin panel's own icon language; reusing
           it here for a completely different concept (2FA) would teach users
           the same pictogram means two different things depending on page)
       Declined on purpose: the two 2FA subsection <h4> labels ("Código por
       correo o SMS", "App autenticadora (TOTP)") do NOT get their own icons.
       They're small uppercase dividers (0.78rem) inside an already-dense
       card; a 3rd/4th tiny icon at that scale adds visual noise without
       adding wayfinding value the label text doesn't already give — the
       icon budget in this ticket is spent on card/page-level headers and
       fields with real disambiguation value (see below), not on every
       sub-heading.

    3) AUTH-FORM FIELD ICONS — sit next to the <label> text (same icon+text
       flex pattern again, sized 18x18 like admin.css's existing
       `.chart-legend svg`, since a field label is small inline text, not a
       page/card title), NEVER inside the input box itself. Icon-inside-input
       was considered and rejected: it needs input padding-left changes,
       absolute positioning, and careful vertical centering per input type
       (color/number inputs already have bespoke sizing in admin.css) for a
       purely cosmetic gain — icon-next-to-label reuses a pattern that
       already exists everywhere else in the app (nav links, card titles)
       with zero new layout risk.
         - login.html "Correo o teléfono"        -> icon-mi-cuenta (reuse)
         - login.html "Contraseña"                -> icon-password (new)
         - register.html "Correo"                 -> icon-correo (new)
         - register.html "Teléfono"                -> icon-telefono (new)
         - register.html "Contraseña"              -> icon-password (reuse)
         - password-reset-request.html "Correo o teléfono" -> icon-mi-cuenta (reuse)
         - password-reset-confirm.html "Nueva contraseña"  -> icon-password (reuse)
         - cuenta.html "Nuevo correo" (Cambiar correo form) -> icon-correo (reuse)
       Declined on purpose: register.html's "Nombre"/"Apellidos" fields, and
       cuenta.html's OTP/TOTP code fields, do NOT get field icons. A generic
       person glyph next to "Nombre" and again next to "Apellidos" doesn't
       disambiguate anything the label doesn't already say — unlike
       correo/teléfono/contraseña, whose icon reinforces the expected input
       *shape* (an address, a number, a secret) at a glance. Applying icons
       everywhere regardless of whether they add scent is decoration, not
       the accessibility/scannability aid this ticket's field-icon idea is
       for — flagging this explicitly rather than adding icons to every
       input silently.

    4) EMPTY/BLOCKED STATE — admin-home.html's `#no-access-message` (a
       role=NONE/no-session user who lands on /ui/admin with no card visible
       for their role, see that file's ticket-025 comment) gets a new
       illustration: illus-sin-acceso. Wrap it in the SAME `.empty-state`
       div structure admin-metrics.html already uses for illus-vacio (icon
       + <p>, centered column) — that class already carries the
       prefers-reduced-motion-aware entrance animation from ticket 024/030,
       so no new CSS/animation is needed, just the same markup shape reused.
       Deliberately a NEW illustration rather than reusing illus-vacio: that
       one means "nothing here yet, but there could be" (optimistic, ties to
       the "+ Añadir cliente" flow) — "sin acceso" means "this isn't for
       you, use a different account", a different message that would get
       blurred by reusing the same picture for both.

    5) NOT part of this ticket's icon additions (raised, deliberately not
       built, so the decision is explicit rather than a silent gap):
         - admin-tenants.html's plain-text empty state ("No hay clientes
           registrados todavía.") is NOT currently wired to illus-vacio at
           all, unlike admin-metrics.html — despite this ticket's own
           depended-on ticket 024 listing "estado vacío de clientes" as
           already covered. That's a real, separate wiring gap (no new SVG
           needed, illus-vacio already exists) — flagged for frontend-dev to
           fix using the exact same `.empty-state` pattern as
           admin-metrics.html, but NOT touched further here since
           admin-tenants.html's table/action-buttons area is ticket 031's
           file in flight in the other worktree right now.
         - admin-tenants.html's action icons (editar/desactivar/reactivar)
           and its create/edit/confirm <dialog> headers are explicitly out
           of scope — ticket 031 owns that file's icon additions; adding
           anything else there risks a real merge conflict with a
           concurrently in-progress ticket touching the same file.
         - admin-metrics.html's provider legend (`renderProviderChart` in
           this template's own <script>) shows raw provider names as text
           ("GOOGLE: 12", "PASSWORD: 3", …). Pairing each with its brand
           logo (logo-google/logo-facebook already exist) was considered,
           but `byProvider` also includes non-social values like "PASSWORD"
           with no brand mark to show — that needs a real fallback glyph
           decision (a generic "contraseña" provider icon) AND a JS mapping
           change in charts.js/this template's script, which is a frontend
           engineering call about the chart's data rendering, not an icon
           the designer can hand off as a static SVG. Left as a follow-up
           idea, not built silently into this ticket's scope.
         - Wiring icon-exito/icon-error (already in this file, built for the
           metrics donut legend) into the SHARED [role=status]/[role=alert]
           boxes app-wide (AuthCoreUi.showStatus() in static/js/api.js) was
           considered — it would give every success/error message across
           all 11 pages in this ticket's scope a checkmark/x at once. Not
           included here because it touches a shared JS helper used by every
           page in the app, not just this ticket's 11 — a scope expansion
           that needs its own explicit go-ahead rather than being folded in
           silently under "icon audit for these 11 views".
    ==========================================================================
  -->
