# Ticket 049: perfil activado SOLO por los contenedores que levantan
# docker-compose.test.yml / docker-compose.prod.yml en la VM
# (SPRING_PROFILES_ACTIVE=deploy) — nunca en local ni en tests.
#
# Por qué existe: hoy la única forma en que este backend encuentra su
# Postgres/Redis es `spring-boot-docker-compose` (ver build.gradle),
# `developmentOnly` — Spring Boot lo excluye automáticamente del jar
# empaquetado (bootJar), así que el jar que corre dentro del contenedor
# Docker NO tiene ninguna otra forma de saber dónde está su base de datos.
# Sin este perfil, la app crashearía al arrancar en cualquier despliegue
# real. Vive en un perfil aparte (no en application.properties) para no
# tocar en absoluto el comportamiento de `bootRun`/tests locales.
#
# DB_PASSWORD deliberadamente SIN default — si falta, Spring falla fuerte
# al resolver el placeholder en vez de arrancar con una contraseña vacía
# (misma filosofía que ResendEmailSender: fallar ruidoso, no en silencio).
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:auth_core_mc}
spring.datasource.username=${DB_USER:auth_core_mc}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
