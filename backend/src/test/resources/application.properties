# @DataJpaTest auto-generates a schema from JPA entity annotations by
# default, bypassing Flyway entirely — that would let repository tests pass
# against a schema that never actually matches what Flyway creates in
# production (e.g. our CHECK/UNIQUE constraints, which aren't expressible
# via JPA annotations, would silently not exist in tests).
#
# ddl-auto=validate disables Hibernate's auto-DDL and instead only checks
# that entity mappings match whatever Flyway already created — so these
# tests exercise the real migration, not a parallel Hibernate-inferred one.
spring.jpa.hibernate.ddl-auto=validate
