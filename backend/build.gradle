plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	// Ticket 010: analiza contra la instancia local de SonarQube (~/dev-infra) desde
	// el pipeline de CI (self-hosted runner, ver .github/workflows/ci.yml — un
	// runner en la nube no podría alcanzar ese localhost).
	id 'org.sonarqube' version '7.4.0.8496'
	// Ticket 011: el Quality Gate de SonarQube exige ≥80% de cobertura en
	// código nuevo (new_coverage), pero ningún reporte de cobertura se
	// generaba ni se enviaba — el gate fallaba en 0% para cualquier PR con
	// código nuevo, sin importar qué tan bien probado estuviera. Bug de
	// infra preexistente de ticket 010, encontrado al intentar mergear este
	// ticket. Ver docs/ARQUITECTURA.md.
	id 'jacoco'
}

group = 'com.mcortes'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// JDK 21 isn't installed on this machine and toolchain auto-download
		// isn't configured; JDK 25 is installed and is also an LTS release
		// (the one after 21), so we target it directly instead.
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// RestClient.Builder auto-configuration moved to its own starter in Boot
	// 4.1 — not bundled with webmvc anymore like it effectively was in 3.x.
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
	// Server-rendered theming (ticket 009): the tenant's app_name/primary_color
	// have to be resolved and injected server-side before the page reaches the
	// browser, since a plain page navigation can't carry the X-Client-Id header
	// the JSON API uses — see docs/ARQUITECTURA.md ticket 009.
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	// Required at runtime by Argon2PasswordEncoder (ticket 002) — missed
	// until now because every test mocks PasswordEncoder or never actually
	// calls encode()/matches() on the real bean; only surfaced by actually
	// running the app (NoClassDefFoundError: Argon2Parameters$Builder).
	runtimeOnly 'org.bouncycastle:bcprov-jdk18on:1.85.2'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
	}
}

tasks.named('sonar') {
	dependsOn tasks.named('jacocoTestReport')
}

sonar {
	properties {
		property "sonar.projectKey", "auth-core-mc"
		property "sonar.projectName", "auth-core-mc"
		// SONAR_HOST_URL/SONAR_TOKEN vienen del entorno (secretos de GitHub
		// Actions) — el plugin los reconoce automáticamente, no hace falta
		// declararlos aquí ni hardcodear nada.
		property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
	}
}
